name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests (Python 3.12)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # scripts/run-tests.py runs exactly the tests of `python3 -m unittest discover -s tests`,
      # split across parallel processes (issue #84). The count check guards the equivalence.
      - name: Run unit test suite
        shell: bash  # bash -eo pipefail: the runner's exit code survives the pipe to tee
        run: |
          expected=$(python3 -c "import unittest; print(unittest.defaultTestLoader.discover('tests').countTestCases())")
          # The output goes outside the checkout: controller snapshots count untracked files,
          # so a file growing in the repository during the run looks like a controller change.
          out="$RUNNER_TEMP/unit-tests.txt"
          python3 scripts/run-tests.py | tee "$out"
          ran=$(grep -oE '^Ran [0-9]+' "$out" | tail -1 | cut -d' ' -f2)
          echo "Discovered $expected tests, ran $ran"
          test "$ran" = "$expected"

  recovery-benchmark:
    name: Isolated A5 Recovery Benchmark
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Grade pinned recovery corpus in isolated process
        run: python3 -I ssdlc_replay_gate.py --output recovery-benchmark.json
