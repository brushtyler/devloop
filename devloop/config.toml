# devloop: dispatcher that moves issues labelled `agent:ready` through
# implementation, independent structured review and fixes, up to a PR that a
# human merges (or devloop, see [merge]). See docs/devloop/guide.md; every key is in
# docs/devloop/reference.md.
#
# The facts of the managed repository and the restrictions it adds (test_cmd, local_tests,
# [tests], language, priority_labels, [docs.map], protected_paths, blocked_labels, sensitive_paths,
# sensitive_path_lists, operator_only_paths) are not here: they are in the project file on the
# host, <state_dir>/project.toml (ADR 0006, R3; docs/devloop/reference.md, "Project file"). ssdlc's
# is ops/host/ssdlc/project.toml. Without a project file, or a test_cmd in the overlay, devloop
# stops at startup: test_cmd is required.
#
# The project's identities and trust (repo, trusted_users, [apps] with its key_dir) are not
# here either: they are the operator's, in the local overlay of the project's state_dir,
# <state_dir>/config.local.toml (ADR 0006, R6; docs/devloop/reference.md, "GitHub identities").
# Each repository has its own set of apps, never shared with another, and its own key_dir
# (D3). ssdlc's keys are in ops/host/ssdlc/overlay.toml. Without repo and trusted_users in the
# overlay, devloop stops at startup.

base_branch = "main"
branch_prefix = "agent/issue-"
# Worktrees, logs and the lock live here, relative to the main checkout (ignored by git). Never
# under .ssdlc/, the state directory of the old SSDLC engine (#563).
state_dir = ".devloop"
# A first CI failure on a head whose failed test modules (the `FAILED MODULE` lines of
# scripts/run-tests.py) are not pertinent to the PR's diff, with the same correspondence as
# local_tests = "changed", is re-run once instead of becoming a round (issue #200). It needs
# `actions: write` on the dispatcher's app; without it the failure is a round, as before. It
# also needs the project's [tests] selection and ci_log_format (ADR 0006, R5): without either
# it is off.
ci_rerun_unrelated = true
# The journal of the turns in state_dir (issue #362) records each turn's intent before its CLI
# starts, and its outcome. A turn left without outcome becomes `uncertain` and is never re-run
# automatically. With this key on, it also refuses every new turn of the same work (the issue
# and its PRs), with an escalation, until a trusted user reconciles it with
# `/devloop reconcile`. Off here: turning it on is the operator's decision (ADR 0004, D8).
block_uncertain_turns = false
# The story identity (issue #363, ADR 0004, P2-3a): at the takeover of an issue the journal of
# state_dir assigns it a story, or adds the new request hash to the story it already has, and the
# comment of its `request` record carries the dispatcher's `story` marker. An issue inherits the
# story of another only from that marker, never from text. Off here: turning it on is the
# operator's decision (ADR 0004, D8).
story_identity = false
# The outbox of the publications (issue #385): every comment, comment edit, native review and
# pull request devloop writes (ledger records, agent outputs, receipts, escalations) is saved in
# the journal of the turns before it is sent. An uncertain outcome (timeout, 5xx) is reconciled
# on the exact comment of the same author before any new POST, never sent again on absence
# alone, and a restart resumes what was left half published.
# Off here: turning it on is the operator's decision (ADR 0004, D8).
publication_outbox = false
# The attempt identity (issue #384, ADR 0004, P2-3b): an implementation runs in an attempt the
# journal opens before its first turn, one active attempt per phase; the PR marker and the turn
# records carry it, and a new attempt starts only once the previous one is concluded (its PR
# merged or closed). It needs story_identity = true. Off here: turning it on is the operator's
# decision (ADR 0004, D8).
attempt_identity = false
# The limit of the journal of the turns in state_dir, in MiB (issue #397). Its size is checked
# before it is loaded and before each event: beyond the limit it is not loaded and no event is
# written, so no turn starts, and nothing is ever removed from it. From 80% of the limit devloop
# warns the operator, once, on [run].alert_issue, or at each start in the log without one.
journal_max_mib = 64

# Readiness check before implement (issue #114): a read-only agent, other than the implementer,
# checks on a checkout of main that the issue can be implemented in one run, and an issue that
# is not ready goes to agent:needs-operator without starting the implementer. Each check takes a
# slot of max_actions_per_tick. Read-only as a review, it takes a reviewer key, never an
# implementer key (#499). Disabled here: enabling it is the operator's decision.
# preflight = "codex-reviewer"

# Conclave on a block (issue #141): when the implementer or a fixer stops as blocked, or a
# reviewer asks for the operator, these three agents (distinct by GitHub identity and by
# kind, model and effort, the one that stopped among them) vote on one written resolution. The
# outcome (UNANIMOUS, BLOCKED or RESERVED) is recorded on the issue or PR, which stays in
# agent:needs-operator. Each call takes a slot of max_actions_per_tick. Read-only as a review, it
# takes reviewer keys, never an implementer key (#499): a block of an implementer convenes none.
# Disabled here: enabling it is the operator's decision.
# conclave = ["claude-reviewer", "codex-reviewer", "agy-reviewer"]
# With [roles.coordinator] (issue #605) a voter that cannot vote does not close the conclave: it
# waits this many seconds, from the first unavailability, for the coordinator's substitute vote
# (/devloop vote); then the block stays with the operator.
# conclave_substitute_timeout_seconds = 7200

max_open_prs = 2            # devloop PRs in progress at once; new issues wait
# PRs waiting for a person (issue #199): agent:needs-operator, and agent:ready-to-merge when
# devloop does not merge them ([merge] mode "off", a level override "off", operator_only_paths;
# since issue #248 these get agent:needs-operator too). They do not take the slots of
# max_open_prs; once this many are open, only priority:high issues start (issue #274).
max_parked_prs = 3
max_review_rounds = 3       # review rounds (including CI failures) before escalating
max_actions_per_tick = 3
# Actions of one tick on different issues and PRs run at once, up to this many (issue #176): two
# actions on the same issue or PR (or on a PR and its issue) stay in plan order, and at level 2
# one review action runs every reviewer the round waits for. Default 1: one action at a time.
max_parallel_actions = 3
implement_test_retries = 1  # extra implementer attempts when local tests fail
agent_timeout_seconds = 3600
test_timeout_seconds = 3600     # suite: ~8 min with test_cmd on 4 CPUs, ~25 min serially
# Claude Code Bash commands that set no timeout stop after this; a command may ask for up to
# test_timeout_seconds (issue #96).
agent_command_timeout_seconds = 600
# An agent turn with no new event in its session transcript and no child process using CPU for
# this long is reported as stalled in the tick log and in `devloop status` (issue #100).
# agent_stall_action: "warn" only reports it; "abort" also stops the turn and escalates it to
# agent:needs-operator with a comment.
agent_stall_seconds = 900
agent_stall_action = "warn"

# Review level of a devloop PR (issue #106): the highest of default_level, level 2 when a trusted
# user ever added `label` to the PR, level 2 when the PR's full diff against the base touches a
# sensitive path, and any level already recorded on the PR. Level 1 needs one reviewer, level 2
# two independent ones from roles.reviewers (issue #111). The policy comes from the running
# dispatcher, never from the PR branch; its hash, which covers the reviewers' apps, models,
# efforts and review_args too, goes into every receipt.
[review_policy]
default_level = 1
label = "reviews:2"
# sensitive_paths (directory prefixes or files, relative to the repository root) and
# sensitive_path_lists (JSON files whose "files" object lists more sensitive paths, read at
# startup relative to the root of the running devloop installation, a pinned checkout) are
# restrictions of the project: the project file adds them, and the overlay may set more. The
# installation has none of its own.
# Advisory review (issue #369): the agent that writes one more review, as a native `COMMENT`
# review with its own identity, of each head of a PR in agent:needs-operator. It may be the
# implementer: it never counts for the quorum nor for the round limit, opens no finding and
# changes no label; devloop never reads it to decide. Empty (the default) turns it off; the
# local overlay turns it on, e.g. advisory_reviewer = "claude-reviewer". It is not part of the
# policy version.
advisory_reviewer = ""
# The findings-only reviewer of ADR 0005, D8, integration of 2026-11-19 (issue #416), off by
# default (D10): turning it on is the operator's decision. At level 2, on a PR whose implementer
# signs with the implementer app and is the same agent, this reviewer key, outside
# roles.reviewers and with another model than the implementer's, reviews each round besides the
# quorum. Its findings join the round in progress and go to the fix; the reviewers of the quorum
# close them. Its approval never counts for the quorum, it never takes the place of a missing
# reviewer, and it is not part of the policy version. Since #499 claude-reviewer is in the pool,
# and a key of the pool stops devloop at startup here: the findings-only reviewer takes one more
# key, outside the pool and without a role in its name (a key with a role names agent and role in
# full, and claude-reviewer is taken), such as claude-findings with Sonnet beside
# claude-implementer with Opus and its own app: its commented table follows
# [agents.claude-reviewer].
# findings_reviewer = "claude-findings"
# The reviewer rules of ADR 0005, P5-5 (issue #409), off by default (D10): turning them on is the
# operator's decision, best with no PR close to its merge (the policy version changes). On, every
# agent and every fallback model declares its `provider` (checked against the prefix of the
# model's name: a claude-* model declared with another provider stops devloop), and at both
# levels a reviewer differs by GitHub identity and (kind, model, effort) from everyone who wrote
# the PR, with at least one reviewer of a provider other than every author's (the only one at
# level 1, quorum rule (ii) of D8): claude-reviewer with Sonnet may then review the code of
# claude-implementer beside codex or agy. A new round skips a reviewer whose models are all
# remembered unavailable, unless it owns an open finding; a round keeps its reviewers until it
# ends.
# provider_quorum = false
# The ban of ADR 0005, P5-6 (issue #410), off by default (D10), independent of provider_quorum:
# at both levels a reviewer's fallback model never runs when its provider is that of an author of
# the PR (the implementer, every fixer and sync, with the fallbacks they actually ran); with no
# model of the chain left the review turn fails (`tool_failure`). On, every agent and fallback
# model declares its `provider`, and a reviewer of the pool with a fallback of a provider other
# than its own model's and the same as an agent's that may implement (agy falling back on Claude
# while claude implements) stops devloop at startup. It enters the policy version.
# fallback_provider_ban = false
# When the second reviewer of a level 2 round starts (issue #521): "parallel" (the default) runs
# both reviewers of the pair together, as before; "sequential" runs the first of the pair (the
# first in the order of roles.reviewers) alone, and the second, on the same head, only once the
# first approved (a needs_operator for the trust policy without findings of its own counts as
# an approval); "parallel_cancel" runs them together, and stops the second's turn (its whole
# process group) as soon as the first asks for changes, recording it as cancelled. In both
# modes other than "parallel" a round the first reviewer closes by asking for changes, or for a
# decision of the operator, is closed with its verdict alone and counts as any round. Quorum,
# receipt and merge conditions do not change. It enters the policy version when it is not
# "parallel". Any other value stops devloop at startup.
# second_reviewer = "parallel"

# Level 0 (issue #107): no review. It applies only when a trusted user added `label` to the PR
# (the latest event of that label added it), the level computed above is 1, and the PR's full
# diff is inside `allowlist`. The head then goes to agent:ready-to-merge (never merged) once
# every check run in `checks` concluded `success` on it; a missing, pending, skipped, neutral
# or cancelled check is not a success. An empty allowlist or an empty `checks` (the default)
# turns level 0 off. Allowlist entries are directories ("docs/") or files; a Markdown file
# counts only when listed by its exact path. AGENTS.md and CLAUDE.md at any depth,
# devloop/prompts/, standards/, .github/, schemas/ and the sensitive paths are never allowed.
[review_policy.zero]
label = "reviews:0"
allowlist = []
# Check runs by exact name and GitHub App id, e.g. { name = "unittest", app_id = 15368 }.
checks = []

# Merge (issue #172). mode:
# - "off" (default): a person merges every PR, as before;
# - "strict": devloop merges a PR in agent:ready-to-merge, with a merge commit bound to the
#   approved head (--match-head-commit), with the app of [apps.merger] (else the local `gh`
#   login it runs with), only if, read
#   again just before the merge: the conditions of the promotion still hold (every required
#   approve, no open finding, head = approved commit, policy receipt recomputed and matching;
#   at level 0 the checks of its promotion), CI is `pass`, GitHub reports MERGEABLE and CLEAN,
#   and neither agent:needs-operator nor agent:merge-hold is set. The branch is kept;
# - "auto": as "strict", and the supervisor (roles.supervisor) or a trusted user can hold a
#   merge with `/devloop hold <reason>` and allow it again with `/devloop release`. Needs
#   roles.supervisor.
# Each merge takes a slot of max_actions_per_tick and runs alone. Enabling it is the operator's
# decision.
[merge]
mode = "off"
# operator_only_paths: a PR touching one of these paths is merged by a person, whatever the mode
# (issue #248). The project file adds the project's to the code's default.
# A mode per review level: the most restrictive of this and `mode` applies (off, then strict,
# then auto).
# [merge.levels]
# "2" = "off"

# Pinned installation (issue #174, see docs/devloop/guide.md). With auto = true, after a merge by
# devloop whose diff touches devloop/, core/ (issue #365) or a file of
# review_policy.sensitive_path_lists, the next
# tick runs `pin origin/<base_branch>` before planning, and `run` and `tick` start again from the
# new copy; a failed pin stops the tick and leaves the pinned copy as it was. Enabling it is the
# operator's decision. With parallel actions (`devloop run`, issue #301) the pin runs at once and
# the loop keeps planning with the code it loaded; it restarts as soon as no action runs. After
# restart_max_wait_minutes of a pending restart no new action starts until the restart.
[pin]
auto = false
restart_max_wait_minutes = 30

# The cleanup of state_dir (issue #380, see docs/devloop/guide.md). It runs at a tick with
# nothing running, at most every interval_minutes (0: at every such tick), and with `devloop gc`;
# each removal goes to the log. pins: after a successful pin, keep `current` and the keep_pins
# copies pinned most recently, and remove the other pinned-* copies that no process uses.
# worktrees: remove the worktrees of closed issues and of closed or merged PRs. logs (off by
# default, turned on in the local overlay): remove the files of logs/ not modified for log_days
# days, never the evidence of an open escalation nor the files of a turn still open in the ledger.
[gc]
pins = true
keep_pins = 5
worktrees = true
logs = false
log_days = 14
interval_minutes = 60

# The system user of the agents and of the tests (issue #415, see docs/devloop/reference.md):
# with a name, the dispatcher starts the agent CLIs and the test command as that user through
# `sudo -n -E -u <name>`, so that they cannot read the app keys (key_dir), state_dir nor the
# local overlay. Empty: they run as the dispatcher's user, as before. The host prepared by
# ops/host/setup-agent-user.sh sets name = "devloop-agent" in the local overlay. check: at the
# start of `tick` and `run`, refuse to start when that user can read or enter key_dir or
# state_dir, can write the repository's .git or the directories that hold the worktrees and its
# turns, or cannot write the directories of its turns; false only in development.
[agent_user]
name = ""
check = true

# `devloop run` (issue #177): after three consecutive failed ticks the loop stops and the
# dispatcher posts an alert on this issue; without it the alert goes only to the local log, and
# the loop stops all the same. Which issue gets it is the operator's choice (local overlay).
[run]
# alert_issue = 123

# `devloop report` (issue #256): the daily summary of devloop's records. With `--publish`, and in
# `devloop run` at most every `interval` minutes, the dispatcher keeps today's summary in the
# body of this issue, a dedicated one, and archives each closed day in a comment. Without it
# `--publish` refuses and `run` publishes nothing. Which issue is the operator's choice (local
# overlay).
[report]
# issue = 123
interval = 15

# `devloop direction` (issue #604): the operator's direction of the project, the latest comment
# of a user of trusted_users on this issue that starts with the line `## Direzione`, given back
# as it is to the coordinator and the supervisor; never in a prompt. Without it the priorities
# stay those of the operator's labels. Which issue is the operator's choice (local overlay).
# [direction]
# issue = 123

# The CI of a new head (issue #263). With local_tests other than "full", a PR in agent:review
# whose head has no CI yet is not reviewed for grace_minutes after its push (the dispatcher's own
# push, else the commit date): GitHub may not have registered the CI yet. After that the full
# suite runs locally before the review, as before, unless the rulesets or the branch protection
# of base_branch require checks: then the review waits for them, and after
# required_timeout_minutes from the push the PR goes to agent:needs-operator (class ci_missing).
[ci]
grace_minutes = 5
required_timeout_minutes = 30

# The budget envelope of each story (issue #365, ADR 0004, P2-5a). With enabled = true each turn
# of an agent is booked, before its CLI starts, in the envelope of its story (it needs
# story_identity = true), and a turn the envelope does not cover is refused with an escalation
# (class budget). Consumption is cumulative across child issues, attempts, fallback models,
# retries and restarts, recorded in the journal of state_dir; nothing refunds a booking. The
# readiness check (preflight) is outside the envelope. With enabled = true every value is
# required, with no default: turns of the story, wall_seconds from its first booking, the dollar
# caps metered_usd (measured spend) and cli_estimate_usd (estimates, today claude's), both above 0
# (a cap is exhausted at equality: 0 would refuse every turn), role_turns for
# implement, fix, review and sync (conclave and advisory too when configured), phase_turns for
# implementation, and in [budget.usage.<agent>] a rule for every agent, claude included (#396):
# model = "unmetered_quota" (no reserve in USD, only the turn caps, D2) and a reason, the only
# rule of codex and agy; "reserve_per_invocation" (with metered_usd and cli_estimate_usd) only for
# claude. The limits a story gets at its first booking stay its own: a later change applies to
# new stories. Token caps are refused: not supported yet. Off here: the values and turning it on
# are the operator's decisions (ADR 0004, D2 and D8). enabled = true is refused at startup until
# the operator lifts the gate of the activation (BUDGET_EXTENSION in devloop/config.py); the
# extension of a story at its limit is [delegations] budget below (grant-budget, ADR 0005;
# docs/devloop/reference.md, "Prerequisites of activation").
# The shape, with no value: the values are not decided yet (D2).
[budget]
enabled = false
# turns = <turns>
# wall_seconds = <seconds>
# metered_usd = <dollars>
# cli_estimate_usd = <dollars>
# [budget.role_turns]
# implement = <turns>
# fix = <turns>
# review = <turns>
# sync = <turns>
# [budget.phase_turns]
# implementation = <turns>
# [budget.usage.codex-reviewer]
# model = "unmetered_quota"
# reason = "codex reports no cost: the turn caps bound it"
# [budget.usage.agy-reviewer]
# model = "unmetered_quota"
# reason = "agy reports no cost: the turn caps bound it"
# [budget.usage.claude-implementer]
# model = "unmetered_quota"
# reason = "claude reports its estimate only when a turn completes"
# [budget.usage.claude-reviewer]
# model = "unmetered_quota"
# reason = "claude reports its estimate only when a turn completes"

# The delegations of the operator to the supervisor (ADR 0005), each with its revocation key, all
# off here: turning one on is the operator's decision (D10); turned off, it is revoked from the
# next tick. rounds (issue #405, P5-1): in merge mode "auto", a PR at the round limit whose
# conditions hold (the latest counted round a CI failure or fewer open blocking findings than the
# round before, no open security finding, the conditions of the supervisor's other escalations)
# goes to the supervisor as round_grantable, and `/devloop grant-round <reason>` grants it one
# more round, with the analysis of the causes in the reason; turned off, the round limit goes to
# the operator, as before. max_rounds_per_pr and max_grants_per_day may only lower the caps of
# the code (2 rounds per PR, 3 grants per UTC day, ADR 0005, D4): a higher value is refused at
# startup. retry_own_prs (issue #406, P5-2) has no effect since issue #527: in "auto" the
# supervisor decides the escalations of process (retry, rereview, grant-round, accept-defaults,
# decide, hold and release, delegated merge) on the PRs of its own agent too, within the caps;
# only a budget extension on such a PR still goes to the operator. The key is still accepted so
# that an overlay that sets it keeps loading. budget (issue #411, P5-7): in "auto", a turn the budget envelope of
# its story refused at a limit (LIMIT_REACHED) that one extension would cover, on a story never
# extended, goes to the supervisor as budget_grantable, and `/devloop grant-budget <reason>`
# extends the envelope of that story once: each turn cap and the time by 25% of their value,
# rounded down (ADR 0005, D3), never dollars nor tokens, within max_grants_per_day; turned off,
# the refused turn goes to the operator, as before. capacity (issue #412, P5-8): in "auto",
# `/devloop capacity <key> <value> <duration> <reason>` on [report] issue (required when on) sets
# max_open_prs or max_parked_prs to value for duration (<N>h or <N>m), then the configured value
# is back; each grant counts against max_grants_per_day. max_parallel_actions is refused: it
# needs a restart. When off, a command on [report] issue is refused as not applicable and spent.
# capacity_max_open_prs, capacity_max_parked_prs and capacity_max_hours may only lower the caps of
# the code (6, 6 and 24 hours). merge (issue #486): in "auto", `/devloop merge <sha> <reason>` of
# the supervisor on a ready PR whose merge is the operator's (operator_merge) merges it with the
# merger's app, only when every condition holds on sha (its head, approved by the quorum with no
# trust_policy, no open finding, CI green, an advisory review ok or dubbi, no host_step, no path of
# the trust rule nor of the delegations, under docs/adr/ only added lines that link a comment of
# a trusted user); it needs review_policy.advisory_reviewer. max_merges_per_day may only lower
# the cap of the code (5 per UTC day, a cap of its own outside max_grants_per_day);
# `/devloop merge-budget <N> <reason>` of a trusted user on [report] issue adds N for that day.
# merge_trust_paths may only add paths to the trust rule of the code.
[delegations]
rounds = false
retry_own_prs = false
budget = false
capacity = false
merge = false
# max_rounds_per_pr = 2
# max_grants_per_day = 3
# capacity_max_open_prs = 6
# capacity_max_parked_prs = 6
# capacity_max_hours = 24

# The documentation map ([docs.map], issue #203) is a fact of the project: it is in the project
# file on the host.

[roles]
# The agent whose GitHub identity may hold and release merges in "auto" mode (issue #172),
# besides trusted_users. Its app's agent:ready and priority labels count too, but only on issues
# opened by a trusted user or by a devloop app (issue #178). In "auto" it also decides the
# non-critical escalations in agent:needs-supervisor with /devloop retry, accept-defaults,
# decide (issue #258) and escalate (issue #182). In any merge mode it may ask for a fix of a PR in agent:review or
# agent:changes with /devloop fix, as a trusted user may (issue #195). As an agent key it takes
# no key with a role: with the keys by role below, roles.supervisor is the table.
# The supervisor's role app (ADR 0005, P5-4, issue #408), off by default: turning it on is the
# operator's decision (D10), best with an empty queue. As a table, roles.supervisor is the
# supervisor actor, not a key of [agents] (devloop does not run it): its name is
# "<kind>-supervisor", and kind, provider and model say which agent runs it. Its identity is then
# the app of [apps.supervisor], and no longer the app of an agent: the commands, labels, issues
# and fix or hold requests of the agent's app stop counting as the supervisor's. A PR counts as
# implemented by the supervisor's agent when the kind or the model of its implementer, as its
# marker records them, is the actor's: since issue #527 that keeps only a budget extension on it
# with the operator.
# [roles.supervisor]
# name = "claude-supervisor"
# kind = "claude"
# provider = "anthropic"
# model = "claude-opus-5-5"
#
# The coordinator (issue #528, ADR 0002, precision of 2026-11-22), off by default: turning it on
# is the operator's decision (D10). The table is the coordinator actor, not a key of [agents]
# (devloop does not run it): its name is "<kind>-coordinator", and it signs with the role app of
# [apps.coordinator], which it needs. Its commands count only inside a closed perimeter fixed in
# the code: retry, rereview, recheck, fix, hold, release, grant-round within the caps,
# accept-defaults, decide (never on the trust policy) and its agent:ready count as a trusted
# user's; merge is its reserved merge (issue #529), under conditions of its own and within a
# daily cap of 10, a constant of the code that max_merges_per_day (optional) may only lower;
# approve, merge-budget, grant-budget, capacity, reconcile and trust stay the operator's; any
# other command is refused (docs/devloop/guide.md, "The coordinator").
# [roles.coordinator]
# name = "codex-coordinator"
# kind = "codex"
# provider = "openai"
# model = "gpt-6.1-sol"
# max_merges_per_day = 10
#
# Agent keys by role and the implementer app (ADR 0005, P5-3, issue #407), on since issue #499:
# a key names agent and role in full and serves that role only: "claude-implementer",
# "codex-reviewer", "agy-reviewer", "claude-reviewer" (a key such as "claude-reviewer" given as
# implementer stops devloop at startup). preflight and conclave, read-only as a review, take a
# reviewer key too, never an implementer key (#499). The implementers declare app = "implementer"
# and sign with [apps.implementer]; the reviewers declare the app of their agent (app = "codex",
# ...). The keys claude, codex and agy are gone: the records that name them are read as they are,
# and the models remembered unavailable move to the new keys. The keys are renamed here, not in
# the local overlay: the overlay merges tables and cannot remove the old keys. An overlay that
# still has [agents.claude], [agents.codex] or [agents.agy] stops devloop at startup, saying
# which table to rename (ops/host/migrate.md, "Chiavi per ruolo su un host attivo"). The
# advisory reviewer, when the overlay turns it on, is review_policy.advisory_reviewer =
# "claude-reviewer".
# The implementer of an issue is chosen at its takeover (D7) and recorded in its request record
# and in its PR's marker: an impl:<kind> label chooses <kind>-implementer and prevails, then the
# area labels of [roles.implementers], then `implementer`. A label counts only when its latest
# labeled event comes from a trusted user, or from the supervisor on an issue of a trusted user
# or of devloop's apps (the rules of the priority labels, issue #178). Two impl: labels, an
# implementer not configured, or areas that lead to different implementers go to the operator
# as `configuration`, and so does an implementer that is the same agent as `preflight`.
# [roles.implementers]
# "area:docs" = "claude-implementer"
implementer = "claude-implementer"
# The reviewer pool, in order; none may be a key that implements. Level 1 uses the PR's
# recorded reviewer (the first of the pool, when the PR was opened, that is not the
# implementer's agent). At both levels a reviewer that is the same agent in effect (same kind,
# model or provider) as the implementer, or at level 2 as a fixer of the PR, is skipped (issue
# #407). Level 2 takes the first pair that differs both in GitHub identity (app) and in (kind,
# model, effort, review_args), and neither of which shares the identity or (kind, model, effort)
# of the implementer or of a fixer of the PR; without such a pair the PR goes to
# agent:needs-operator. `reviewer = "codex-reviewer"` is a pool of one. claude-reviewer, with
# Sonnet and the app of claude, is the third reviewer, last, as a reserve (ADR 0005, D8, issue
# #499): with the check of the same agent (provider_quorum off) it never reviews the code of
# claude-implementer. With review_policy.provider_quorum (issue #409) the quorum rule on the
# provider replaces that check: claude-reviewer then reviews a PR of claude only beside a
# reviewer of another provider, when codex-reviewer or agy-reviewer is missing, remembered
# unavailable at a new round, or not independent.
reviewers = ["codex-reviewer", "agy-reviewer", "claude-reviewer"]

[agents.claude-implementer]
kind = "claude"
# The implementer's role app (issue #407): commits, pushes, PRs and the records of the fixes.
app = "implementer"
provider = "anthropic"
display_name = "Claude Code"
model = "claude-opus-5-5"
model_label = "Claude Opus 5.5"
effort = "high"
# No web tools: the repository is public, and its issues and comments are readable without
# credentials; agents get the trusted content from the prompt only (issue #79).
# `python3 -m unittest *` covers the targeted form that the implement and fix prompts suggest,
# `python3 -m unittest discover -s tests -p 'test_name.py'` (issue #83).
write_args = ["--permission-mode", "acceptEdits",
              "--allowedTools", "Bash(python3 -m unittest *)", "Bash(git status *)",
              "Bash(git diff *)", "Bash(git log *)", "Bash(git show *)",
              "--disallowedTools", "WebFetch", "WebSearch"]
review_args = ["--allowedTools", "Bash(git diff *)", "Bash(git log *)", "Bash(git show *)",
               "Bash(python3 -m unittest tests.*)",
               "Bash(PYTHONPATH=tests python3 -m unittest tests.*)",
               "--disallowedTools", "Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]
commit_trailer = "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"

[agents.codex-reviewer]
kind = "codex"
app = "codex"
provider = "openai"
display_name = "Codex"
model = "gpt-6.1-sol"
model_label = "gpt-6.1-sol"
# Reviews need the deeper pass: on PR #112 a medium review approved while a high one
# reproduced five remaining defects (issue #123). The operator asked for high, never less.
effort = "high"

[agents.agy-reviewer]
kind = "agy"
app = "agy"
provider = "google"
display_name = "Antigravity"
model = "gemini-4-argon-high"
model_label = "Gemini 4 Argon"
effort = "high"
# Argon has a budget of its own: when a turn fails because the model is unavailable (quota or
# budget exhausted, model not available, rate limit), the same turn runs again on the next
# fallback model, each at most once per action (issue #121). A fallback inherits `effort` when
# it sets none, and never reasons below high. Its `provider` (issue #409) is its own, never the
# agent's: required, as the agent's, only with review_policy.provider_quorum or
# review_policy.fallback_provider_ban (#410). What counts as unavailable: `unavailable_patterns`
# (default "RESOURCE_EXHAUSTED", "quota", "429", "model .* not available") in the output of a
# failed turn, each as a delimited word or code (#443), or an exit code in
# `unavailable_exit_codes` (default none). An output with only `(code 400)` never counts, not
# even with a listed exit code.
fallback_models = [
    { model = "gemini-4-hydrogen-high", model_label = "Gemini 4 Hydrogen", provider = "google" },
]
# A model found unavailable is remembered in <state_dir>/model-unavailability.json, and the
# next turns start from the first model of the chain not remembered (issue #151): until the
# reset the error announces ("Resets in 152h4m35s"), else for fallback_memory_seconds (default
# 3600). `devloop fallback reset agy-reviewer` forgets it. Without fallback_models nothing is
# remembered.
# fallback_memory_seconds = 3600
# A model that a turn's denied permission stops twice (the retry included) is left for the next
# model of the chain, and remembered the same way for denied_cooldown_hours (default 6, issue
# #319). On the last model the turn escalates (tool_failure) naming the model and the command.
# denied_cooldown_hours = 6
# Headless agy cannot ask for a permission (issue #122): each turn gets, with --settings, only
# `command(<prefix>)` rules for these command prefixes. Default for both lists: test_cmd (of the
# overlay or of this file, never of the project file: ADR 0006, D2), "python3 -m unittest",
# "git status", "git diff", "git log", "git show". A bare interpreter,
# shell or git (also by path, as /bin/sh), wildcards and shell syntax stop devloop at startup,
# and so do --dangerously-skip-permissions and --settings in write_args or review_args.
# Changing review_commands voids agy's earlier approvals, as a change of model would.
# review_commands = ["python3 scripts/run-tests.py", "python3 -m unittest", "git diff"]
# write_commands = [...]

# The third reviewer (ADR 0005, D8, issue #499): claude with another model than the
# implementer's, signing with the app of claude. Last in the pool, it reviews only when one of the
# first two is missing, unavailable or not independent.
[agents.claude-reviewer]
kind = "claude"
app = "claude"
provider = "anthropic"
display_name = "Claude Code"
model = "claude-sonnet-5-5"
model_label = "Claude Sonnet 5.5"
effort = "high"
review_args = ["--allowedTools", "Bash(git diff *)", "Bash(git log *)", "Bash(git show *)",
               "Bash(python3 -m unittest tests.*)",
               "Bash(PYTHONPATH=tests python3 -m unittest tests.*)",
               "--disallowedTools", "Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

# The findings-only reviewer of review_policy.findings_reviewer (issue #416), off by default: a
# key outside roles.reviewers, claude with another model than the implementer's. Each app
# belongs to one actor, and [apps.claude] is claude-reviewer's: it signs with an app of its own,
# [apps.claude-findings] in the local overlay (#512). With the line of findings_reviewer,
# turning it on is the operator's decision.
# [agents.claude-findings]
# kind = "claude"
# app = "claude-findings"
# provider = "anthropic"
# display_name = "Claude Code"
# model = "claude-sonnet-5-5"
# model_label = "Claude Sonnet 5.5"
# effort = "high"
# review_args = ["--allowedTools", "Bash(git diff *)", "Bash(git log *)", "Bash(git show *)",
#                "Bash(python3 -m unittest tests.*)",
#                "Bash(PYTHONPATH=tests python3 -m unittest tests.*)",
#                "--disallowedTools", "Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

# GitHub Apps (issue #65): one per agent, one for the dispatcher, one for merges (#201), one
# for the supervisor (#408) and one for the implementers (#407). An agent signs with the table
# of its key, or with the one it declares with `app`. App
# ids and slugs are not secret. Private keys are read from key_dir (or $DEVLOOP_APP_KEY_DIR) as
# <slug>.<date>.private-key.pem, mode 600. An actor without an app uses the ambient `gh` login.
# The tables are the project's, in the local overlay of its state_dir (ADR 0006, R6): one set of
# apps per repository, installed on that repository only, with a key_dir of its own (D3); the
# merger only where devloop merges. Default key_dir: "~/.ghapps". ssdlc's are in
# ops/host/ssdlc/overlay.toml.
# [apps]
# key_dir = "~/.ghapps"
# [apps.dispatcher]
# app_id = ...
# slug = "<prefix>dispatcher"
# [apps.claude], [apps.codex], [apps.agy]: the agents' apps, which `devloop token`
#   (scripts/agent-token.py) exposes.
# [apps.claude-findings]: the app of the findings-only reviewer (issue #512), only when the
#   overlay turns it on, with the permissions of the agents' apps.
# [apps.merger]: the app that merges in "strict" and "auto" mode (issue #201), with contents:
#   write and pull_requests: write. It does nothing else, and `devloop token` does not expose it.
#   Without it, merges use the local `gh` login.
# [apps.supervisor]: the supervisor's role app (ADR 0005, P5-4, issue #408), with issues: write
#   and pull_requests: write and no contents. It counts as the supervisor only with
#   [roles.supervisor] as a table. devloop never reads its key, which is in the key_dir of the
#   supervisor's system user; the supervisor mints its tokens with scripts/supervisor-token.py,
#   and `devloop token` does not expose it.
# [apps.coordinator]: the coordinator's role app (issue #528), with issues: write and
#   pull_requests: write, actions, checks and statuses read, and no contents. It counts as the
#   coordinator only with [roles.coordinator]. devloop never reads its key, which is in the
#   key_dir of the coordinator's system user; the coordinator mints its tokens with
#   scripts/coordinator-token.py (issue #549), and `devloop token` does not expose it.
# [apps.implementer]: the implementer's role app (ADR 0005, P5-3, issue #407), with contents:
#   write, pull_requests: write and issues: write, without workflows. It signs commits, pushes,
#   PRs and the records of fixes and syncs of every agent that declares app = "implementer", and
#   only a <kind>-implementer key may declare it. Until one does, devloop does not read its key.
#   `devloop token` does not expose it.
