# I parametri di un progetto per la sentinella dei ruoli a riposo (ops/host/role-sentinel-project.conf,
# #684). setup-supervisor.sh e setup-coordinator.sh la installano, sostituendo i segnaposto con i
# valori di params.env, come drop-in dell'istanza del progetto:
# SYSTEMD_DIR/devloop-role-sentinel@<progetto>.service.d/project.conf. L'utente è del solo
# progetto e non è nel gruppo dei ruoli: entra nella casella del progetto con le sue ACL, e
# scrive solo in rest/.
[Unit]
Description=devloop role sentinel (@REPO@)

[Service]
User=@SENTINEL_USER@
Group=@SENTINEL_USER@
ReadWritePaths=@COORDINATION_DIR@/rest
ExecStart=/usr/bin/bash @WATCHDOG_OPS_DIR@/host/role-sentinel.sh --params @WATCHDOG_OPS_DIR@/params.env
