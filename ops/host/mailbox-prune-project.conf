# I parametri di un progetto per la pulizia di done/ delle caselle (ops/host/mailbox-prune-project.conf,
# #707). setup-coordinator.sh (o setup-supervisor.sh, se il progetto non ha il coordinatore) la
# installa, sostituendo i segnaposto con i valori di params.env e con la sua copia di root, come
# drop-in dell'istanza del progetto:
# SYSTEMD_DIR/devloop-mailbox-prune@<progetto>.service.d/project.conf.
[Unit]
Description=devloop mailbox of the roles, cleanup of done/ (@REPO@)

[Service]
ReadWritePaths=@COORDINATION_DIR@
ExecStart=/usr/bin/bash @MAILBOX_OPS_DIR@/host/mailbox.sh --params @MAILBOX_OPS_DIR@/params.env prune
