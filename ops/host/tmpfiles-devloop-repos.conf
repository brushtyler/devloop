# La directory dei lock per repository di devloop (ops/host/tmpfiles-devloop-repos.conf,
# ADR 0006, R8). setup-devloop.sh la installa in TMPFILES_FILE sostituendo i segnaposto con i
# valori di params.env; systemd-tmpfiles crea la directory, e la ricrea a ogni avvio se sta in
# /run, che è in memoria.
#
# Ogni dispatcher prende all'avvio, senza attendere, il lock <proprietario>--<nome>.lock del suo
# repository (repo_lock_dir nell'overlay): due dispatcher sullo stesso repository non partono
# insieme, qualunque sia il loro state_dir o il loro utente.
# 3770: di root, del gruppo degli utenti devloop dell'host e di nessun altro; setgid, così ogni
# lock è del gruppo; sticky, così nessun utente toglie o sostituisce il lock di un altro. Gli
# utenti degli agent e il supervisore non vi entrano, e il gruppo non dà accesso agli state_dir.
d @REPO_LOCK_DIR@ 3770 root @REPO_LOCK_GROUP@ -
