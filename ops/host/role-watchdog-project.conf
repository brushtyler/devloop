# I parametri di un progetto per il watchdog dei ruoli (ops/host/role-watchdog-project.conf, #602).
# setup-supervisor.sh e setup-coordinator.sh la installano, sostituendo i segnaposto con i valori
# di params.env, come drop-in delle due istanze del progetto:
# SYSTEMD_DIR/devloop-role-watchdog@<progetto>.service.d/project.conf e
# SYSTEMD_DIR/devloop-role-watchdog-failed@<progetto>.service.d/project.conf. L'utente è del solo
# progetto e non è nel gruppo dei ruoli: entra nella casella del progetto con le sue ACL, e in
# nessun'altra.
[Unit]
Description=devloop role watchdog (@REPO@)

[Service]
User=@WATCHDOG_USER@
Group=@WATCHDOG_USER@
ReadWritePaths=@COORDINATION_DIR@
ExecStart=/usr/bin/bash @WATCHDOG_OPS_DIR@/host/role-watchdog.sh --params @WATCHDOG_OPS_DIR@/params.env
