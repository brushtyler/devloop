# I parametri di un progetto per l'unità template devloop@.service (ops/host/devloop-project.conf,
# ADR 0006, R8). setup-devloop.sh, con PROJECT in params.env, la installa come drop-in
# SYSTEMD_DIR/devloop@<progetto>.service.d/project.conf sostituendo i segnaposto con i valori di
# params.env: un utente di sistema, un clone, uno state_dir e un log per progetto.
[Unit]
Description=devloop continuous loop (@REPO@)

[Service]
User=@DEVLOOP_USER@
Group=@DEVLOOP_USER@
WorkingDirectory=@DEVLOOP_CLONE@
# Dove il servizio trova le CLI degli agent, gh e git: ~/.local/bin dell'utente devloop prima.
Environment=PATH=@DEVLOOP_PATH@
# Il launcher della copia fissata; aggiunge --local-config quando l'overlay esiste.
ExecStart=@LAUNCHER_CMD@ run
StandardOutput=append:@STATE_PATH@/run.log
StandardError=append:@STATE_PATH@/run.log
